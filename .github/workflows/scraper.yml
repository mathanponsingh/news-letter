name: Reuters Scraper Automation

on:
  schedule:
    # Runs every 5 minutes for testing (GitHub Actions minimum interval is 5 minutes)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Chromium & Driver)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-driver

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraping/requirements.txt

      - name: Run Reuters Scraper
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
        run: |
          python scraping/app.py
